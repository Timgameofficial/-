<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>для тебя</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Sacramento&family=Lato:wght@100;300&display=swap');

:root {
  --bg:    #08080f;
  --mid:   #0d0818;
  --gold:  #f5c842;
  --glow:  rgba(245,200,66,0.45);
  --dim:   rgba(245,200,66,0.12);
  --cream: #f5f0e8;
  --muted: rgba(245,240,232,0.55);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  width: 100%; height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--cream);
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  cursor: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  touch-action: manipulation;
  overscroll-behavior: none;
  min-height: -webkit-fill-available;
  min-height: 100dvh;
}

@media (pointer:coarse) {
  body { cursor: auto; touch-action: manipulation; }
}

#bg-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  will-change: transform;
}

.cursor {
  position: fixed; width: 10px; height: 10px;
  background: var(--gold); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  translate: -50% -50%; mix-blend-mode: screen;
  transition: scale 0.18s cubic-bezier(0.34,1.56,0.64,1);
  will-change: transform;
}
.cursor.big { scale: 3; }
.cursor-ring {
  position: fixed; width: 36px; height: 36px;
  border: 1px solid rgba(245,200,66,0.3); border-radius: 50%;
  pointer-events: none; z-index: 9998;
  translate: -50% -50%; mix-blend-mode: screen;
  will-change: transform;
}
@media (pointer:coarse) { .cursor, .cursor-ring { display: none !important; } }

#flash {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transition: opacity 0.55s ease;
}
#flash.in  { opacity: 1; pointer-events: all; }
#tunnel-canvas {
  position: fixed; inset: 0; z-index: 200;
  pointer-events: none; opacity: 0;
  transition: opacity 0.35s ease;
  will-change: opacity;
}
#tunnel-canvas.active { opacity: 1; }

.scene {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: calc(var(--safe-top) + 40px) 28px calc(var(--safe-bot) + 40px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1),
              transform 0.75s cubic-bezier(0.16,1,0.3,1);
  transform: translateY(28px);
  text-align: center;
  will-change: opacity, transform;
}
.scene.active {
  opacity: 1; pointer-events: all; transform: translateY(0);
}
.scene.exit-up   {
  opacity: 0;
  transform: translateY(-35px);
  transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1),
              transform 0.5s cubic-bezier(0.16,1,0.3,1);
}
.scene.exit-down {
  opacity: 0;
  transform: translateY(35px);
  transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1),
              transform 0.5s cubic-bezier(0.16,1,0.3,1);
}

#progress {
  position: fixed; right: 20px; top: 50%;
  translate: 0 -50%; z-index: 100;
  display: flex; flex-direction: column; gap: 10px;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(245,200,66,0.2);
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer;
}
.dot.active { background: var(--gold); scale: 1.6; box-shadow: 0 0 10px var(--glow); }
.dot.done   { background: rgba(245,200,66,0.45); }

.orb {
  position: fixed; border-radius: 50%;
  pointer-events: none; z-index: 1;
  filter: blur(80px);
  animation: drift var(--d) ease-in-out var(--dl) infinite alternate;
  will-change: transform;
}
@keyframes drift {
  from { transform: translate(0,0); }
  to   { transform: translate(var(--tx),var(--ty)); }
}

.petal {
  position: fixed; pointer-events: none; z-index: 2;
  opacity: 0; animation: floatUp var(--d) ease var(--dl) infinite;
  will-change: transform, opacity;
}
@keyframes floatUp {
  0%   { transform: translateY(105vh) rotate(0deg) scale(0); opacity: 0; }
  8%   { opacity: 0.35; transform: translateY(82vh) rotate(40deg) scale(1); }
  92%  { opacity: 0.08; }
  100% { transform: translateY(-10vh) rotate(340deg) scale(0.25); opacity: 0; }
}

#s0 .label {
  font-family: 'Lato', sans-serif; font-weight: 100;
  font-size: clamp(10px, 2.2vw, 16px);
  letter-spacing: 0.5em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 24px;
  overflow: hidden; white-space: nowrap;
}
.typewriter {
  display: inline-block;
  border-right: 1px solid rgba(245,200,66,0.55);
}

#s0 .name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(64px, 16vw, 148px);
  line-height: 0.85; color: var(--gold);
  text-shadow: 0 0 80px var(--glow), 0 0 200px var(--dim);
  letter-spacing: -0.02em;
  animation: nameGlow 4.5s ease infinite alternate;
}
@keyframes nameGlow {
  from { text-shadow: 0 0 80px var(--glow), 0 0 180px var(--dim); }
  to   { text-shadow: 0 0 130px var(--glow), 0 0 320px rgba(245,200,66,0.18); }
}

.cta-btn {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(14px, 2.8vw, 21px);
  color: rgba(245,240,232,0.45);
  letter-spacing: 0.3em; text-transform: uppercase;
  background: none; border: none; cursor: pointer;
  margin-top: 52px; padding: 14px 28px;
  position: relative; overflow: hidden;
  animation: hintPulse 2.8s ease infinite;
  transition: color 0.35s;
  -webkit-tap-highlight-color: transparent;
  min-height: 48px; min-width: 48px;
}
.cta-btn:hover, .cta-btn:active { color: rgba(245,240,232,0.8); }
@keyframes hintPulse {
  0%,100% { opacity: 0.5; } 50% { opacity: 1; }
}
.cta-btn .cta-arrow {
  display: inline-block; margin-left: 8px;
  animation: arrowBounce 2s ease infinite;
}
@keyframes arrowBounce {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(7px); }
}

#s1 { overflow: hidden; }
#s1 .title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(22px, 4.5vw, 44px);
  color: var(--cream); margin-bottom: 32px;
  line-height: 1.35;
  padding: 0 12px;
}
.reasons-wrap {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 500px;
}
@media (min-width: 560px) {
  .reasons-wrap {
    grid-template-columns: repeat(4, 1fr);
    max-width: 600px;
    gap: 12px;
  }
}
.reason-card {
  background: rgba(245,200,66,0.03);
  border: 1px solid rgba(245,200,66,0.1);
  border-radius: 3px;
  padding: clamp(10px, 2vw, 16px) 6px;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: border-color 0.3s, background 0.3s,
              transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.3s;
  opacity: 0; transform: scale(0.72) translateY(18px);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 44px;
  will-change: transform, opacity;
}
.reason-card.visible {
  opacity: 1; transform: scale(1) translateY(0);
  transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34,1.56,0.64,1),
              border-color 0.3s, background 0.3s, box-shadow 0.3s;
}
.reason-card:hover, .reason-card.tapped {
  border-color: rgba(245,200,66,0.4);
  background: rgba(245,200,66,0.08);
  transform: scale(1.07) translateY(-2px);
  box-shadow: 0 0 18px rgba(245,200,66,0.1);
}
.reason-card .icon {
  font-size: clamp(18px, 3.5vw, 22px);
  filter: drop-shadow(0 0 7px rgba(245,200,66,0.45));
  animation: twinkle var(--td,3s) ease var(--tl,0s) infinite;
}
@keyframes twinkle {
  0%,100%{ opacity:1; transform:scale(1); }
  50%    { opacity:0.35; transform:scale(0.78); }
}
.reason-card:hover .icon, .reason-card.tapped .icon {
  filter: drop-shadow(0 0 20px rgba(245,200,66,1));
  animation: none; transform: scale(1.35) rotate(18deg);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s;
}
.reason-card .word {
  font-family: 'Sacramento', cursive;
  font-size: clamp(12px, 2.2vw, 15px);
  color: rgba(245,240,232,0.6);
  transition: color 0.3s;
  line-height: 1.2;
}
.reason-card:hover .word, .reason-card.tapped .word { color: var(--gold); }

.card-ripple {
  position: absolute; border-radius: 50%;
  background: rgba(245,200,66,0.12);
  pointer-events: none;
  animation: cardRipple 0.6s ease forwards;
}
@keyframes cardRipple { to { transform: scale(5); opacity: 0; } }

.next-btn {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(15px, 2.6vw, 21px);
  color: rgba(245,200,66,0.55);
  border: 1px solid rgba(245,200,66,0.2);
  background: transparent;
  padding: 14px 44px; cursor: pointer;
  margin-top: 32px; letter-spacing: 0.08em;
  position: relative; overflow: hidden;
  transition: color 0.35s, border-color 0.35s,
              transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.35s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 52px;
}
.next-btn::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(245,200,66,0.06);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.next-btn:hover::before, .next-btn:active::before { transform: scaleX(1); }
.next-btn:hover {
  color: var(--gold); border-color: rgba(245,200,66,0.55);
  transform: scale(1.04);
  box-shadow: 0 0 30px rgba(245,200,66,0.18);
}
.next-btn:active { transform: scale(0.97); }

#s2 { gap: 0; }
#heart-canvas {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
  will-change: transform;
}
#s2 .inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
}

.confession {
  font-family: 'Sacramento', cursive;
  font-size: clamp(34px, 7.5vw, 72px);
  color: var(--gold); line-height: 1.45;
  text-shadow: 0 0 55px rgba(245,200,66,0.5);
  margin-bottom: 20px;
}
.sub {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(14px, 2.5vw, 21px);
  color: rgba(245,240,232,0.58); line-height: 1.75;
  margin-bottom: 32px;
  padding: 0 12px;
  max-width: 480px;
}

#touch-heart-hint {
  font-family: 'Lato', sans-serif; font-weight: 100;
  font-size: clamp(9px, 1.8vw, 11px); letter-spacing: 0.45em;
  text-transform: uppercase;
  color: rgba(245,200,66,0.3);
  animation: hintPulse 2.4s ease infinite;
  margin-bottom: 32px;
}

#s3 .q-text {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(26px, 5.5vw, 54px);
  color: var(--cream); margin-bottom: 12px;
  line-height: 1.3;
  padding: 0 12px;
}
#s3 .q-sub {
  font-family: 'Lato', sans-serif; font-weight: 100;
  font-size: clamp(9px, 1.6vw, 12px);
  letter-spacing: 0.42em; text-transform: uppercase;
  color: rgba(245,240,232,0.25); margin-bottom: 48px;
}
.answer-btns {
  display: flex; flex-direction: column; gap: 14px;
  align-items: center; width: 100%;
  max-width: min(380px, 90vw);
}
.ans-btn {
  width: 100%; padding: 18px 28px;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(17px, 3.8vw, 27px);
  color: var(--gold);
  border: 1px solid rgba(245,200,66,0.3);
  background: transparent; cursor: pointer;
  letter-spacing: 0.05em; position: relative; overflow: hidden;
  transition: border-color 0.4s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow   0.4s cubic-bezier(0.34,1.56,0.64,1),
              transform    0.4s cubic-bezier(0.34,1.56,0.64,1),
              background   0.4s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 56px;
}
.ans-btn::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(245,200,66,0.07);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.ans-btn:hover::before { transform: scaleX(1); }
.ans-btn:hover {
  border-color: var(--gold);
  box-shadow: 0 0 44px rgba(245,200,66,0.25), inset 0 0 20px rgba(245,200,66,0.05);
  transform: scale(1.03);
}
.ans-btn:active {
  transform: scale(0.97);
  background: rgba(245,200,66,0.05);
}

#s4 .finale-text {
  font-family: 'Sacramento', cursive;
  font-size: clamp(42px, 10vw, 100px);
  color: var(--gold); line-height: 1.3;
  text-shadow: 0 0 70px rgba(245,200,66,0.65);
  white-space: pre-line;
  animation: heartbeat 1.9s ease infinite;
  padding: 0 16px;
}
@keyframes heartbeat {
  0%,100% { transform:scale(1); text-shadow:0 0 70px rgba(245,200,66,0.6); }
  50%      { transform:scale(1.04); text-shadow:0 0 140px rgba(245,200,66,1), 0 0 280px rgba(245,200,66,0.28); }
}
#s4 .replay-btn {
  font-family: 'Lato', sans-serif; font-weight: 100;
  font-size: clamp(9px, 1.8vw, 11px); letter-spacing: 0.5em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.2);
  background: none; border: none; cursor: pointer;
  margin-top: 56px; padding: 14px 20px;
  transition: color 0.35s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 48px;
}
#s4 .replay-btn:hover,
#s4 .replay-btn:active { color: rgba(245,240,232,0.42); }

#conf-canvas {
  position: fixed; inset: 0; z-index: 300;
  pointer-events: none;
}

@media (max-width: 480px) {
  .scene { padding: calc(var(--safe-top) + 32px) 20px calc(var(--safe-bot) + 32px); }
  #s1 .title { margin-bottom: 22px; }
  .next-btn  { margin-top: 24px; padding: 14px 36px; }
  #s3 .q-sub { margin-bottom: 36px; }
  .answer-btns { gap: 12px; }
  #s4 .finale-text { font-size: clamp(38px, 12vw, 72px); }
}

@media (max-height: 500px) and (orientation: landscape) {
  .scene { justify-content: flex-start; padding-top: calc(var(--safe-top) + 16px); }
  #s0 .name { font-size: clamp(48px, 12vw, 88px); }
  .reasons-wrap { gap: 7px; max-width: 100%; }
  .reason-card { padding: 8px 4px; gap: 4px; }
  #s1 .title { margin-bottom: 16px; font-size: clamp(18px, 3.5vw, 32px); }
  .next-btn { margin-top: 16px; padding: 10px 32px; }
  .confession { font-size: clamp(26px, 5vw, 48px); }
  .sub { font-size: clamp(12px, 2vw, 16px); margin-bottom: 16px; }
  #s4 .finale-text { font-size: clamp(32px, 8vw, 60px); }
  #s4 .replay-btn { margin-top: 28px; }
}
</style>
</head>
<body>

<div class="cursor"      id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<canvas id="bg-canvas"></canvas>
<canvas id="tunnel-canvas"></canvas>
<canvas id="heart-canvas"></canvas>
<canvas id="conf-canvas"></canvas>

<div id="flash"></div>

<div class="orb" style="width:480px;height:480px;background:rgba(245,200,66,0.03);top:-90px;left:-130px;--d:10s;--dl:0s;--tx:75px;--ty:65px;"></div>
<div class="orb" style="width:320px;height:320px;background:rgba(160,80,220,0.025);bottom:0;right:-90px;--d:13s;--dl:2.5s;--tx:-65px;--ty:-85px;"></div>
<div class="orb" style="width:260px;height:260px;background:rgba(245,200,66,0.022);bottom:28%;left:8%;--d:11s;--dl:5.5s;--tx:55px;--ty:-55px;"></div>

<div id="progress"></div>

<section class="scene active" id="s0">
  <div class="label"><span class="typewriter" id="tw"></span></div>
  <div class="name" id="name-el"></div>
  <button class="cta-btn" id="s0-next">
    раскрыть <span class="cta-arrow">↓</span>
  </button>
</section>

<section class="scene" id="s1">
  <div class="title" id="s1-title">за что я люблю тебя до боли</div>
  <div class="reasons-wrap" id="reasons-wrap"></div>
  <button class="next-btn" id="s1-next">хочу сказать ещё →</button>
</section>

<section class="scene" id="s2">
  <div class="inner">
    <div class="confession" id="confession-el"></div>
    <div class="sub">В каждом твоём выдохе — вся нежность мира.<br>В каждой мелочи, которую ты не замечаешь в себе,<br>я нахожу красоту, от которой захватывает дух.</div>
    <div id="touch-heart-hint">♡ &nbsp; коснись сердца &nbsp; ♡</div>
    <button class="next-btn" id="s2-next">и есть один вопрос →</button>
  </div>
</section>

<section class="scene" id="s3">
  <div class="q-text">Позволишь ли ты мне<br>быть рядом?</div>
  <div class="q-sub">выбери ответ</div>
  <div class="answer-btns">
    <button class="ans-btn" data-answer="yes1">💛 &nbsp; Да, всей душой</button>
    <button class="ans-btn" data-answer="yes2">✨ &nbsp; Да... и ещё раз да</button>
    <button class="ans-btn" data-answer="yes3">🌙 &nbsp; Навсегда — да</button>
  </div>
</section>

<section class="scene" id="s4">
  <div class="finale-text" id="finale-text"></div>
  <button class="replay-btn" id="replay-btn">↺ &nbsp; с начала</button>
</section>

<script>
const C = {
  name:       'Полина-Мария',
  intro:      'Есть кое-что важное...',
  confession: 'Я люблю тебя.\nБезмерно и навсегда.',
  finale:     'Я счастливейший\nчеловек на свете ✨',
  reasons: [
    {icon:'✦', word:'Твой смех'},
    {icon:'◈', word:'Твои глаза'},
    {icon:'❋', word:'Как ты думаешь'},
    {icon:'✿', word:'Твоя доброта'},
    {icon:'◇', word:'Твой голос'},
    {icon:'✦', word:'Твоя улыбка'},
    {icon:'❈', word:'Твоя сила'},
    {icon:'✺', word:'Твои руки'},
    {icon:'◈', word:'Твоя нежность'},
    {icon:'✦', word:'Твоя мечта'},
    {icon:'❋', word:'Твой характер'},
    {icon:'✿', word:'Просто ты'},
  ]
};

const SCENES = ['s0','s1','s2','s3','s4'];
let current = 0;
const isMobile = window.matchMedia('(pointer:coarse)').matches;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('name-el').textContent = C.name;
document.getElementById('confession-el').innerHTML = C.confession.replace(/\n/g,'<br>');
document.getElementById('finale-text').textContent = C.finale;

const progEl = document.getElementById('progress');
SCENES.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.addEventListener('click', () => { if(i <= current+1) goTo(i); });
  progEl.appendChild(d);
});
function updateDots() {
  progEl.querySelectorAll('.dot').forEach((d,i) => {
    d.className = 'dot' + (i===current?' active':(i<current?' done':''));
  });
}

function runTypewriter(text, el, speed=50) {
  return new Promise(res => {
    let i = 0;
    el.textContent = '';
    const iv = setInterval(() => {
      if(i >= text.length) { clearInterval(iv); setTimeout(res,350); return; }
      el.textContent += text[i++];
    }, speed);
  });
}

const curEl  = document.getElementById('cursor');
const ringEl = document.getElementById('cursor-ring');
let cx=0, cy=0;
if (!isMobile) {
  document.addEventListener('mousemove', e => {
    cx=e.clientX; cy=e.clientY;
    curEl.style.left  = cx+'px'; curEl.style.top  = cy+'px';
    requestAnimationFrame(()=>{
      ringEl.style.left = cx+'px'; ringEl.style.top = cy+'px';
    });

  ringEl.style.transitionProperty = 'left,top';
  ringEl.style.transitionDuration = '0.1s';

    b.addEventListener('mouseleave',()=>curEl.classList.remove('big'));
  });
}

const bgC = document.getElementById('bg-canvas');
const bgX = bgC.getContext('2d');
let stars=[], starT=0, gyroX=0, gyroY=0, lerpGX=0, lerpGY=0;
let mouseSX=0, mouseSY=0, lerpMX=0, lerpMY=0;
const STAR_COUNT = isMobile ? 140 : 220;

if (!isMobile) {
  document.addEventListener('mousemove', e => {
    mouseSX=e.clientX; mouseSY=e.clientY;
  },{passive:true});
} else if (window.DeviceOrientationEvent) {
  const go = () => window.addEventListener('deviceorientation', e => {
    gyroX = (e.gamma||0) * 0.07;
    gyroY = (e.beta||0)  * 0.04;
  },{passive:true});
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.addEventListener('touchstart', () =>
      DeviceOrientationEvent.requestPermission().then(p => { if(p==='granted') go(); }),
    {once:true, passive:true});
  } else go();
}

function buildStars() {
  stars = [];
  for (let i=0; i<STAR_COUNT; i++) stars.push({
    x: Math.random()*bgC.width, y: Math.random()*bgC.height,
    vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18,
    r: Math.random()*1.4+.2,
    phase:Math.random()*Math.PI*2, ts:.008+Math.random()*.016,
    da:Math.random()*Math.PI*2, ds:.025+Math.random()*.08,
    gold: i > STAR_COUNT-16
  });
}
function resizeBG() {
  bgC.width=window.innerWidth; bgC.height=window.innerHeight;
  buildStars();
}
resizeBG();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeBG, 150);
},{passive:true});

let lastBGTime = 0;
const BG_FPS = isMobile ? 30 : 60;
const BG_INTERVAL = 1000 / BG_FPS;

function drawBG(timestamp) {
  requestAnimationFrame(drawBG);
  if (timestamp - lastBGTime < BG_INTERVAL) return;
  lastBGTime = timestamp;

  bgX.clearRect(0,0,bgC.width,bgC.height);
  starT += .01;
  if (!isMobile) {
    const tx=(mouseSX-bgC.width/2)*.0022, ty=(mouseSY-bgC.height/2)*.0022;
    lerpMX+=(tx-lerpMX)*.035; lerpMY+=(ty-lerpMY)*.035;
  } else {
    lerpGX+=(gyroX-lerpGX)*.055; lerpGY+=(gyroY-lerpGY)*.055;
    lerpMX=lerpGX; lerpMY=lerpGY;
  }
  stars.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.x += Math.cos(s.da)*s.ds; s.y += Math.sin(s.da)*s.ds; s.da += .002;
    if(s.x<-5) s.x=bgC.width+5; if(s.x>bgC.width+5) s.x=-5;
    if(s.y<-5) s.y=bgC.height+5; if(s.y>bgC.height+5) s.y=-5;
    const a = .2+.7*(.5+.5*Math.sin(starT*s.ts*60+s.phase));
    bgX.beginPath(); bgX.arc(s.x+lerpMX, s.y+lerpMY, s.r, 0, Math.PI*2);
    bgX.fillStyle = s.gold ? `rgba(245,200,66,${a*.7})` : `rgba(245,240,232,${a})`;
    bgX.fill();
  });
}
requestAnimationFrame(drawBG);

const tunC = document.getElementById('tunnel-canvas');
const tunX = tunC.getContext('2d');
let tunRunning=false, tunT=0;

function resizeTun() { tunC.width=window.innerWidth; tunC.height=window.innerHeight; }
resizeTun();
window.addEventListener('resize', () => resizeTun(), {passive:true});

let lastTunTime = 0;
function drawTunnel(timestamp) {
  if(!tunRunning) return;
  if (timestamp - lastTunTime < 16) { requestAnimationFrame(drawTunnel); return; }
  lastTunTime = timestamp;

  tunX.clearRect(0,0,tunC.width,tunC.height);
  const cx=tunC.width/2, cy=tunC.height/2;
  tunT += .055;
  for(let i=26; i>0; i--) {
    const r = (i/26)*(Math.max(tunC.width,tunC.height)*0.82) * (1-(tunT%1)*.045);
    const a = (i/26)*0.55*(1-(tunT%1)*.025);
    tunX.beginPath(); tunX.arc(cx,cy,r,0,Math.PI*2);
    tunX.strokeStyle = `rgba(245,200,66,${a*.38})`;
    tunX.lineWidth = 1+i*.08; tunX.stroke();
  }
  for(let k=0; k<6; k++) {
    const angle = (k/6)*Math.PI*2 + tunT*.45;
    const len = Math.max(tunC.width,tunC.height);
    tunX.beginPath(); tunX.moveTo(cx,cy);
    tunX.lineTo(cx+Math.cos(angle)*len, cy+Math.sin(angle)*len);
    tunX.strokeStyle = `rgba(245,200,66,${.055+.038*Math.sin(tunT+k)})`;
    tunX.lineWidth=1; tunX.stroke();
  }
  requestAnimationFrame(drawTunnel);
}
const hrtC = document.getElementById('heart-canvas');
const hrtX = hrtC.getContext('2d');
let hparts=[], hphase=0, heartActive=false;
const MAX_HPARTS = isMobile ? 180 : 350;

function resizeHeart() { hrtC.width=window.innerWidth; hrtC.height=window.innerHeight; }
resizeHeart();
window.addEventListener('resize', resizeHeart, {passive:true});

function hx(t){ return 16*Math.pow(Math.sin(t),3); }
function hy(t){ return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); }

function spawnHeartBurst(px, py, count=isMobile?18:28) {
  for(let i=0; i<count; i++) {
    const angle=Math.random()*Math.PI*2, spd=1+Math.random()*3.5;
    hparts.push({
      x:px, y:py,
      vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd,
      life:1, decay:.014+Math.random()*.018,
      size:2+Math.random()*4.5, type:'burst',
      gold: Math.random()>.4
    });
  }
  if(navigator.vibrate) navigator.vibrate([12,8,18]);
}

let lastHrtTime = 0;
const HRT_FPS = isMobile ? 30 : 60;
const HRT_INTERVAL = 1000 / HRT_FPS;

function drawHeartLoop(timestamp) {
  requestAnimationFrame(drawHeartLoop);
  if (timestamp - lastHrtTime < HRT_INTERVAL) return;
  lastHrtTime = timestamp;

  hrtX.clearRect(0,0,hrtC.width,hrtC.height);
  hphase += .016;
  if(heartActive) {
    const cx=hrtC.width/2, cy=hrtC.height/2;
    const scale=Math.min(hrtC.width,hrtC.height)*(.023+.003*Math.sin(hphase*2));
    const trailCount = isMobile ? 2 : 4;
    for(let i=0; i<trailCount; i++) {
      const a=Math.random()*Math.PI*2;
      hparts.push({
        x:cx+hx(a)*scale, y:cy-hy(a)*scale,
        vx:(Math.random()-.5)*.55, vy:(Math.random()-.5)*.55,
        life:1, decay:.006+Math.random()*.005,
        size:1.5+Math.random()*2.2, type:'trail', gold:false
      });
    }
    hrtX.beginPath();
    for(let a=0; a<Math.PI*2; a+=.045) {
      const x=cx+hx(a)*scale, y=cy-hy(a)*scale;
      a<.01 ? hrtX.moveTo(x,y) : hrtX.lineTo(x,y);
    }
    hrtX.closePath();
    const pulse=.12+.1*Math.sin(hphase*3);
    hrtX.strokeStyle=`rgba(245,200,66,${pulse})`;
    hrtX.lineWidth=1.5; hrtX.stroke();
  }
  if(hparts.length > MAX_HPARTS) hparts.splice(0, hparts.length - MAX_HPARTS);
  hparts = hparts.filter(p => p.life>0);
  hparts.forEach(p => {
    if(p.type==='burst') { p.vx*=.93; p.vy*=.93; }
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    hrtX.beginPath(); hrtX.arc(p.x,p.y,p.size,0,Math.PI*2);
    hrtX.fillStyle = p.gold
      ? `rgba(255,220,80,${p.life*.8})`
      : `rgba(245,200,66,${p.life*.65})`;
    hrtX.fill();
  });
}
requestAnimationFrame(drawHeartLoop);

const confC = document.getElementById('conf-canvas');
const confX = confC.getContext('2d');
let confPieces=[], confRunning=false;
const COLORS=['#f5c842','#e8b8f0','#f0e8b8','#b8f0e8','#f0b8c8','#ffd6a5','#c8f0d8'];
const CONF_SPAWN = isMobile ? 7 : 12;

function resizeConf() { confC.width=window.innerWidth; confC.height=window.innerHeight; }
resizeConf();
window.addEventListener('resize', resizeConf, {passive:true});

function spawnConf() {
  for(let i=0; i<CONF_SPAWN; i++) confPieces.push({
    x: Math.random()*confC.width, y: -20,
    vx:(Math.random()-.5)*5, vy:2+Math.random()*5,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    rot:Math.random()*Math.PI*2, rv:(Math.random()-.5)*.22,
    w:8+Math.random()*8, h:4+Math.random()*4.5, g:0,
    shape: Math.random()>.5 ? 'rect':'circle'
  });
}
let lastConfTime = 0;
function drawConf(timestamp) {
  if(!confRunning) return;
  requestAnimationFrame(drawConf);
  if (timestamp - lastConfTime < 16) return;
  lastConfTime = timestamp;

  confX.clearRect(0,0,confC.width,confC.height);
  spawnConf();
  confPieces = confPieces.filter(c => c.y < confC.height+50);
  confPieces.forEach(c => {
    c.g+=.038; c.vy+=c.g*.011; c.x+=c.vx; c.y+=c.vy; c.rot+=c.rv;
    confX.save(); confX.translate(c.x,c.y); confX.rotate(c.rot);
    confX.fillStyle=c.color; confX.globalAlpha=.85;
    if(c.shape==='circle') { confX.beginPath(); confX.arc(0,0,c.h/2,0,Math.PI*2); confX.fill(); }
    else confX.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    confX.restore();
  });
}
let transitioning = false;

function goTo(next, dir='up') {
  if(next===current || transitioning) return;
  transitioning = true;

  const from = document.getElementById(SCENES[current]);
  const to   = document.getElementById(SCENES[next]);

  from.classList.add(dir==='up' ? 'exit-up' : 'exit-down');
  from.classList.remove('active');

  setTimeout(() => from.classList.remove('exit-up','exit-down'), 650);

  current = next;
  updateDots();

  setTimeout(() => {
    to.classList.add('active');
    onSceneEnter(next);
    transitioning = false;
  }, 300);
}

function tunnelTransition(next) {
  if(transitioning) return;
  transitioning = true;

  tunC.classList.add('active');
  tunRunning = true; tunT = 0;
  requestAnimationFrame(drawTunnel);

  const flash = document.getElementById('flash');
  setTimeout(() => flash.classList.add('in'), 460);
  setTimeout(() => {
    tunC.classList.remove('active');
    tunRunning = false;
    flash.classList.remove('in');
    transitioning = false;
    goTo(next, 'up');
  }, 750);
}
